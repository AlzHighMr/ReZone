.mast-logo { text-decoration: none; color: #eee; display: block; }

.appbar { position: sticky; top: 0; z-index: 50; background: #0b0b0bf2; border-top: 1px solid #ffffff14; box-shadow: 0 1px 0 #8e3320, 0 8px 24px #0008; }

.ab-tabs { display: flex; gap: 2px; height: 100%; align-items: stretch; }

.ab-sub a.on { color: #e0a43a; border-color: #e0a43a; }

.lock::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; background: linear-gradient(90deg, #c4492c 0 140px, #e0a43a 140px 180px, #2a2a2a 180px); }
.lock .eb { font: 600 12px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: #c4492c; }

.lock p { color: #96938b; margin: 0 0 18px; }
.lock form { display: flex; gap: 8px; }
.lock input { flex: 1; background: #151515; border: 1px solid #333; color: #eee; font: 600 20px "JetBrains Mono", Consolas, monospace; letter-spacing: .3em; padding: 10px 14px; outline: none; }
.lock input:focus { border-color: #e0a43a; }
.lock button { background: linear-gradient(180deg, #c4492c, #8e3320); color: #fff; border: 0; font: 700 18px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 0 22px; cursor: pointer; }
.lock .err { color: #ef8b78; min-height: 1.5em; margin: 10px 0 0; font-size: 15px; }
.lock label.rem { display: flex; gap: 8px; align-items: center; color: #96938b; font-size: 14px; margin-top: 12px; }
