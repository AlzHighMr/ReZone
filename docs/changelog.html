.mast-in { max-width: 1340px; margin: 0 auto; padding: 56px 24px 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; min-height: 240px; }
.mast-logo { text-decoration: none; color: #eee; display: block; }
.ml-pre { display: block; font: 600 13px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: .32em; text-transform: uppercase; color: #bdb8ad; }

.ml-name i { font-style: normal; color: #c4492c; }
.ml-sub { display: inline-block; font: 600 14px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; color: #111; background: #e0a43a; padding: 6px 10px 5px; }
.appbar { position: sticky; top: 0; z-index: 50; background: #0b0b0bf2; border-top: 1px solid #ffffff14; box-shadow: 0 1px 0 #8e3320, 0 8px 24px #0008; }
.ab-in { max-width: 1340px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 18px; height: 54px; }
.ab-tabs { display: flex; gap: 2px; height: 100%; align-items: stretch; }
.ab-tabs a { display: flex; align-items: center; padding: 0 20px; color: #b9b5ab; text-decoration: none; font: 700 18px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.ab-tabs a:hover { color: #fff; background: #ffffff0a; }
.ab-tabs a.on { color: #fff; background: linear-gradient(180deg, #c4492c, #8e3320); clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
.ab-sub { margin-left: auto; display: flex; gap: 6px; }
.ab-sub a { font: 600 13px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: #96938b; text-decoration: none; padding: 8px 12px; border: 1px solid #333; }
.ab-sub a.on { color: #e0a43a; border-color: #e0a43a; }
.ab-sub button { font: 600 13px/1 "JetBrains Mono", Consolas, monospace; background: none; color: #96938b; border: 1px solid #333; padding: 8px 12px; cursor: pointer; }
.ab-sub button:hover { color: #fff; border-color: #8e3320; }
.lock { max-width: 520px; margin: 60px auto; padding: 30px 34px 34px; background: #101010f2; border: 1px solid #262626; position: relative; box-shadow: 0 20px 60px #000c; }
.lock::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 3px; background: linear-gradient(90deg, #c4492c 0 140px, #e0a43a 140px 180px, #2a2a2a 180px); }
.lock .eb { font: 600 12px/1 "JetBrains Mono", Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: #c4492c; }
.lock h2 { font: 700 36px/1.05 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .03em; margin: 10px 0 8px; color: #ecebe6; }
.lock p { color: #96938b; margin: 0 0 18px; }
.lock form { display: flex; gap: 8px; }
.lock input { flex: 1; background: #151515; border: 1px solid #333; color: #eee; font: 600 20px "JetBrains Mono", Consolas, monospace; letter-spacing: .3em; padding: 10px 14px; outline: none; }
.lock input:focus { border-color: #e0a43a; }
.lock button { background: linear-gradient(180deg, #c4492c, #8e3320); color: #fff; border: 0; font: 700 18px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .1em; text-transform: uppercase; padding: 0 22px; cursor: pointer; }
.lock .err { color: #ef8b78; min-height: 1.5em; margin: 10px 0 0; font-size: 15px; }
.lock label.rem { display: flex; gap: 8px; align-items: center; color: #96938b; font-size: 14px; margin-top: 12px; }
.lock label.rem input { flex: none; width: auto; }
@media (max-width: 900px) {
